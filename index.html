<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 성격유형 검사</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* 배경 3D 파티클 */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle 8s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateZ(0) rotateX(0); }
            25% { transform: translateY(-80px) translateZ(50px) rotateX(90deg); }
            50% { transform: translateY(-30px) translateZ(100px) rotateX(180deg); }
            75% { transform: translateY(-100px) translateZ(50px) rotateX(270deg); }
        }

        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            transform-style: preserve-3d;
            animation: containerEntry 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes containerEntry {
            0% { opacity: 0; transform: rotateX(15deg) translateY(60px) scale(0.9); }
            100% { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }
        }

        /* 3D 큐브 인트로 */
        .cube-wrapper {
            width: 120px; height: 120px;
            margin: 0 auto 25px;
            perspective: 600px;
        }

        .cube {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 6s infinite linear;
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0) rotateY(0); }
            25% { transform: rotateX(90deg) rotateY(90deg); }
            50% { transform: rotateX(180deg) rotateY(180deg); }
            75% { transform: rotateX(270deg) rotateY(270deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .cube-face {
            position: absolute;
            width: 120px; height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .cube-face.front  { background: linear-gradient(135deg,#667eea,#764ba2); transform: translateZ(60px); }
        .cube-face.back   { background: linear-gradient(135deg,#f093fb,#f5576c); transform: rotateY(180deg) translateZ(60px); }
        .cube-face.right  { background: linear-gradient(135deg,#4facfe,#00f2fe); transform: rotateY(90deg) translateZ(60px); }
        .cube-face.left   { background: linear-gradient(135deg,#43e97b,#38f9d7); transform: rotateY(-90deg) translateZ(60px); }
        .cube-face.top    { background: linear-gradient(135deg,#fa709a,#fee140); transform: rotateX(90deg) translateZ(60px); }
        .cube-face.bottom { background: linear-gradient(135deg,#a18cd1,#fbc2eb); transform: rotateX(-90deg) translateZ(60px); }

        /* 시작 화면 */
        .intro h1 {
            text-align: center;
            font-size: 2.2em;
            color: #333;
            margin-bottom: 10px;
            animation: fadeSlideUp 0.8s 0.3s both;
        }

        .intro .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 1.05em;
            animation: fadeSlideUp 0.8s 0.5s both;
        }

        .intro .description {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            line-height: 1.8;
            color: #555;
            animation: fadeSlideUp 0.8s 0.7s both;
        }

        .intro .description strong { color: #667eea; }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .btn-start {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeSlideUp 0.8s 0.9s both;
            transform-style: preserve-3d;
        }

        .btn-start:hover {
            transform: translateY(-3px) rotateX(5deg);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-start:active {
            transform: translateY(0) scale(0.98);
        }

        /* 진행바 */
        .progress-bar {
            background: #eee;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-text {
            text-align: center;
            color: #999;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        /* 질문 영역 */
        .question-section { display: none; }

        .question-text {
            font-size: 1.3em;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 60px;
        }

        .question-text.animate-in {
            animation: questionFlipIn 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes questionFlipIn {
            0% { opacity: 0; transform: perspective(600px) rotateY(-30deg) translateX(-30px); }
            100% { opacity: 1; transform: perspective(600px) rotateY(0) translateX(0); }
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 18px 24px;
            background: #f8f9ff;
            border: 2px solid #e8eaff;
            border-radius: 12px;
            font-size: 1.05em;
            color: #444;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: left;
            line-height: 1.5;
            transform-style: preserve-3d;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #eef0ff;
            transform: translateX(8px) rotateY(-3deg);
            box-shadow: -5px 5px 15px rgba(102, 126, 234, 0.15);
        }

        .option-btn:active {
            transform: translateX(4px) scale(0.98);
        }

        .option-btn.animate-in {
            animation: optionSlideIn 0.4s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        @keyframes optionSlideIn {
            0% { opacity: 0; transform: translateX(40px) rotateY(-10deg); }
            100% { opacity: 1; transform: translateX(0) rotateY(0); }
        }

        /* 결과 화면 */
        .result-section { display: none; text-align: center; }

        .result-section.animate-in .character-area { animation: bounceIn 0.8s 0.1s both; }
        .result-section.animate-in .result-type { animation: fadeSlideUp 0.6s 0.4s both; }
        .result-section.animate-in .result-name { animation: fadeSlideUp 0.6s 0.5s both; }
        .result-section.animate-in .trait-bars { animation: fadeSlideUp 0.6s 0.6s both; }
        .result-section.animate-in .result-card:nth-of-type(1) { animation: cardFlipIn 0.6s 0.7s both; }
        .result-section.animate-in .result-card:nth-of-type(2) { animation: cardFlipIn 0.6s 0.8s both; }
        .result-section.animate-in .counseling-section { animation: cardFlipIn 0.6s 0.9s both; }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3) rotateY(-180deg); }
            50% { transform: scale(1.05) rotateY(0); }
            70% { transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1) rotateY(0); }
        }

        @keyframes cardFlipIn {
            0% { opacity: 0; transform: perspective(600px) rotateX(-15deg) translateY(30px); }
            100% { opacity: 1; transform: perspective(600px) rotateX(0) translateY(0); }
        }

        /* 캐릭터 영역 */
        .character-area {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            position: relative;
        }

        .character-area svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
        }

        .result-type {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 1.4em;
            color: #555;
            margin-bottom: 25px;
        }

        .trait-bars {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .trait-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .trait-label {
            width: 30px;
            font-weight: bold;
            font-size: 0.95em;
            text-align: center;
        }

        .trait-label.active { color: #667eea; }
        .trait-label.inactive { color: #ccc; }

        .trait-bar-bg {
            flex: 1;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .trait-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .trait-bar-fill.left { background: linear-gradient(90deg, #667eea, #a8b4ff); }
        .trait-bar-fill.right { background: linear-gradient(90deg, #ffb8b8, #764ba2); float: right; }

        .trait-percent {
            width: 40px;
            font-size: 0.85em;
            color: #999;
        }

        .result-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: left;
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }

        .result-card:hover {
            transform: perspective(600px) rotateX(2deg) rotateY(-2deg) translateY(-3px);
        }

        .result-card h3 { color: #667eea; margin-bottom: 12px; font-size: 1.1em; }
        .result-card p { color: #555; line-height: 1.8; }

        .counseling-section {
            background: linear-gradient(135deg, #fff3e0, #fff8e1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: left;
            border: 1px solid #ffe0b2;
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }

        .counseling-section:hover {
            transform: perspective(600px) rotateX(2deg) rotateY(2deg) translateY(-3px);
        }

        .counseling-section h3 { color: #e65100; margin-bottom: 12px; }
        .counseling-section p { color: #555; line-height: 1.8; }
        .counseling-section ul { color: #555; line-height: 2; margin-left: 20px; margin-top: 8px; }

        .btn-restart {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            transform-style: preserve-3d;
        }

        .btn-restart:hover {
            transform: translateY(-3px) rotateX(5deg);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .container { padding: 25px; }
            .intro h1 { font-size: 1.6em; }
            .result-type { font-size: 2.4em; }
            .cube-wrapper { width: 90px; height: 90px; }
            .cube-face { width: 90px; height: 90px; font-size: 1.3em; }
            .cube-face.front  { transform: translateZ(45px); }
            .cube-face.back   { transform: rotateY(180deg) translateZ(45px); }
            .cube-face.right  { transform: rotateY(90deg) translateZ(45px); }
            .cube-face.left   { transform: rotateY(-90deg) translateZ(45px); }
            .cube-face.top    { transform: rotateX(90deg) translateZ(45px); }
            .cube-face.bottom { transform: rotateX(-90deg) translateZ(45px); }
            .character-area { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>
    <!-- 배경 파티클 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 시작 화면 -->
        <div class="intro" id="intro">
            <div class="cube-wrapper">
                <div class="cube">
                    <div class="cube-face front">M</div>
                    <div class="cube-face back">B</div>
                    <div class="cube-face right">T</div>
                    <div class="cube-face left">I</div>
                    <div class="cube-face top">16</div>
                    <div class="cube-face bottom">?</div>
                </div>
            </div>
            <h1>MBTI 성격유형 검사</h1>
            <p class="subtitle">나를 이해하는 첫걸음, 심리 상담용 MBTI 테스트</p>
            <div class="description">
                <p>이 검사는 <strong>16가지 성격유형</strong> 중 나에게 해당하는 유형을 찾아줍니다.</p>
                <p>총 <strong>20개의 질문</strong>으로 구성되어 있으며, 각 질문에 대해 자신에게 더 가까운 답변을 선택해 주세요.</p>
                <p>정답은 없습니다. 편안하게 평소의 자신을 떠올리며 응답해 주세요.</p>
            </div>
            <button class="btn-start" onclick="startTest()">검사 시작하기</button>
        </div>

        <!-- 질문 화면 -->
        <div class="question-section" id="questionSection">
            <div class="progress-text" id="progressText">1 / 20</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 5%"></div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="options"></div>
        </div>

        <!-- 결과 화면 -->
        <div class="result-section" id="resultSection">
            <div class="character-area" id="characterArea"></div>
            <div class="result-type" id="resultType"></div>
            <div class="result-name" id="resultName"></div>
            <div class="trait-bars" id="traitBars"></div>
            <div class="result-card" id="resultDescription"></div>
            <div class="result-card" id="resultStrength"></div>
            <div class="counseling-section" id="counselingTip"></div>
            <button class="btn-restart" onclick="restart()">다시 검사하기</button>
        </div>
    </div>

    <script>
        // 배경 파티클 생성

            const container = document.getElementById('particles');
            const colors = ['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fee140'];
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 20 + 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 6 + 5) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);

        let currentQuestion = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        function startTest() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('questionSection').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            const qText = document.getElementById('questionText');
            qText.textContent = q.q;
            qText.classList.remove('animate-in');
            void qText.offsetWidth;
            qText.classList.add('animate-in');

            document.getElementById('progressText').textContent = `${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            q.a.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn animate-in';
                btn.style.animationDelay = (0.15 + index * 0.1) + 's';
                btn.textContent = answer;
                btn.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(btn);
            });
        }

        function selectAnswer(index) {
            const q = questions[currentQuestion];
            const type = q.type;
            if (index === 0) { scores[type[0]]++; } else { scores[type[1]]++; }
            currentQuestion++;
            if (currentQuestion < questions.length) { showQuestion(); } else { showResult(); }
        }

        function showResult() {
            document.getElementById('questionSection').style.display = 'none';

            resultSection.classList.add('animate-in');

                scores.S >= scores.N ? 'S' : 'N',
                scores.T >= scores.F ? 'T' : 'F',
                scores.J >= scores.P ? 'J' : 'P'
            ].join('');

            const result = mbtiResults[mbti];

            document.getElementById('resultType').textContent = mbti;
            document.getElementById('resultName').textContent = result.name;

                const total = scores[left] + scores[right];

                const rightPercent = 100 - leftPercent;
                const isLeft = scores[left] >= scores[right];

                row.className = 'trait-row';
                row.innerHTML = `
                    <span class="trait-label ${isLeft ? 'active' : 'inactive'}">${left}</span>
                    <span class="trait-percent">${leftPercent}%</span>
                    <div class="trait-bar-bg">
                        <div class="trait-bar-fill ${isLeft ? 'left' : 'right'}" style="width: 0%"></div>

                    <span class="trait-percent">${rightPercent}%</span>
                    <span class="trait-label ${!isLeft ? 'active' : 'inactive'}">${right}</span>
                `;
                traitBarsDiv.appendChild(row);
                setTimeout(() => {
                    row.querySelector('.trait-bar-fill').style.width = (isLeft ? leftPercent : rightPercent) + '%';
                }, 800);
            });

            document.getElementById('resultDescription').innerHTML = `<h3>성격 특성</h3><p>${result.desc}</p>`;
            document.getElementById('resultStrength').innerHTML = `<h3>강점</h3><p>${result.strength}</p>`;
            let tipsHtml = result.tips.map(t => `<li>${t}</li>`).join('');
            document.getElementById('counselingTip').innerHTML = `<h3>심리 상담 포인트</h3><p>${result.counsel}</p><ul>${tipsHtml}</ul>`;
        }

        function restart() {
            currentQuestion = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            const resultSection = document.getElementById('resultSection');
            resultSection.style.display = 'none';
            resultSection.classList.remove('animate-in');
            document.getElementById('intro').classList.remove('hidden');
        }
    </script>
</body>
</html>
